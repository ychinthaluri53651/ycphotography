name: Add photos

on:
  push:
    branches: [main]
    paths: ["photos-to-add/**", "assets/css/**", "assets/js/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-photos
  cancel-in-progress: false

jobs:
  add-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install image libraries
        run: "pip install --require-hashes --only-binary :all: -r tools/requirements.txt"

      - name: Resize photos and add them to the portfolio
        run: python3 tools/add_photos.py --clean

      - name: Make browsers fetch changed styles and scripts
        run: python3 tools/stamp_assets.py

      - name: Commit the new photos
        run: |
          git add -A assets photos-to-add ./*.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the portfolio"
          git pull --rebase
          git push
